project:
  type: website
  output-dir: docs
  # Copied into docs/ on every render. A full render empties docs/, and GitHub Pages
  # needs CNAME (custom domain dnield.com) and .nojekyll (serve files as-is).
  resources:
    - CNAME
    - .nojekyll

website:
  # title: "Personal Website"
  title: "David Nield"
  site-url: "https://dnield.com"
  favicon: files/profile.jpg
  twitter-card:
    creator: "@DRNield"
    site: "@DRNield"
    card-style: "summary_large_image"
  open-graph:
    locale: en_US
  google-analytics: "G-EZ5WZFDWDZ"
  navbar:
    title: false
    left:
      - href: index.qmd
      - text: Blog
        href: blog.qmd
      - text: Openings
        href: openings/index.qmd
      - text: Resume
        href: files/resume.pdf

format:
  html:
    theme: ember.scss
    css: styles.css
    toc: true

editor: visual

